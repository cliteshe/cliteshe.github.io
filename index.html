<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Board</title>
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;400&display=swap');

        body {
            background-color: rgb(161, 100, 223);
            font-family: 'Poppins', sans-serif;

        }


        #buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, 125px);
            gap: 5px;
            justify-content: center;
            max-width: 100%;
            margin: auto;

        }

        .btn {
            background-color: rebeccapurple;
            border-radius: 5px;
            border: none;
            color: #fff;
            margin: 0px;
            font-size: 13pt;
            font-family: inherit;
            cursor: pointer;
            height: 125px;
        }

        .btn:hover {
            opacity: 0.7;
        }

        .btn:focus {
            outline: none;
        }


        @media screen and (max-width: 600px) {
            #buttons {
                display: grid;
                grid-template-columns: repeat(auto-fill, 60px);
                gap: 2px;
                justify-content: center;
                max-width: 100%;
                margin: auto;

            }

            .btn {
                background-color: rebeccapurple;
                border-radius: 5px;
                border: none;
                color: #fff;
                margin: 0.1rem;
                font-size: .6rem;
                font-family: inherit;
                cursor: pointer;
                height: 60px;
            }

        }
    </style>
</head>



<body>
    <div id="audio"></div>


    <div id="buttons"></div>

    <script>
        const sounds = [

            'denied',
            'doh',
            'dont worry everybody',
            'dun dun dun',
            'eerie',
            'evil laugh',
            'fah',
            'fatality',
            'finish him',

            'why do you have to hate',
            'womp womp',
            'wow',
            'wrong',
            'x files',
            'yeayuh'
        ]

        sounds.forEach(sound => {
            const btn = document.createElement('button');
            btn.classList.add('btn');
            btn.innerText = sound;
            document.getElementById('audio').innerHTML += `<audio id='${sound}' src="sounds/${sound}.mp3"></audio>`
            btn.addEventListener('click', () => {
                stopSongs()
                sound.volume = 1.6;
                document.getElementById(sound).play()
                sound.pause();
                sound.currentTime = 0;
            })

            document.getElementById('buttons').appendChild(btn)
        })

        function stopSongs() {
            sounds.forEach(sound => {
                const song = document.getElementById(sound)
                song.pause()
                song.currentTime = 0;
            })
        }


    </script>

</body>

</html>
